name: Deploy ExamFlow to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          ACADEMIC_TERM: ${{ vars.ACADEMIC_TERM }}
        run: |
          mkdir -p dist
          cp index.html app.css app.js workflow-core.js workflow-store.js demo-data.js tracker-admin.js dist/
          sed -i "s/?v=local/?v=${GITHUB_SHA}/g" dist/index.html
          cat > dist/config.js <<CONFIG
          window.EXAMFLOW_CONFIG = {
            mode: "production",
            supabaseUrl: "${SUPABASE_URL}",
            supabaseAnonKey: "${SUPABASE_ANON_KEY}",
            institutionName: "Department of Biomedical Engineering",
            institutionShort: "BME",
            academicTerm: "${ACADEMIC_TERM:-2026}"
          };
          CONFIG
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
